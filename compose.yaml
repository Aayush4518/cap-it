services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      CAPIT_API_KEY: ${CAPIT_API_KEY}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      INSTANCE_ID: api1
      REDIS_URL: redis://redis:6379
      PROMETHEUS_URL: http://prometheus:9090
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api2:
    build: .
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NODE_ENV: development
      CAPIT_API_KEY: ${CAPIT_API_KEY}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      INSTANCE_ID: api2
      REDIS_URL: redis://redis:6379
      PROMETHEUS_URL: http://prometheus:9090
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  load-runner:
    build:
      context: .
      dockerfile: Dockerfile.load-runner
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      LOAD_RUNNER_HOST: 0.0.0.0
      LOAD_RUNNER_PORT: 3100
      API1_URL: http://api1:3000
      API2_URL: http://api2:3000
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6
    profiles: ["load"]
    volumes:
      - ./tests/load:/scripts:ro
    environment:
      CAPIT_API_KEY: ${CAPIT_API_KEY}
      API_URL: http://api1:3000
      API1_URL: http://api1:3000
      API2_URL: http://api2:3000
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  prometheus-data:
    name: cap-it-prometheus-data
  grafana-data:
    name: cap-it-grafana-data
